# PWM on P0.26 + P0.27 for scope (see app_pwm_i2c_pins_scope.overlay).
# RTT printk only — uart0 disabled in overlay.
#
# nRF Connect: set Kconfig / devicetree overlay to this conf + app_pwm_i2c_pins_scope.overlay

CONFIG_VITABAND_PWM_I2C_PIN_SCOPE=y
CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=n
CONFIG_VITABAND_SPARKFUN_TMP102_DK=n
CONFIG_VITABAND_TMP117_I2C_DEMO=n

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_PWM=y

CONFIG_BT=n
CONFIG_SHELL=n
CONFIG_SPI=n
CONFIG_ADC=n
CONFIG_I2C=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
