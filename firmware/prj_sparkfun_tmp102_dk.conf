# SparkFun TMP102 (I2C 0x48) on nRF52840 DK Arduino header — temperature every 500 ms on Segger RTT.
# Uses **i2c0** (TWIM0) on D14/D15.
# Alternatives: prj_sparkfun_tmp102_dk_i2c1.conf (TWIM1 on D14/D15),
# prj_sparkfun_tmp102_dk_i2c1_a4a5.conf (A4/A5 = P0.30/P0.31),
# prj_sparkfun_tmp102_dk_custom_pins.conf (edit overlay for any legal TWIM pins).
#
# west build -b nrf52840dk/nrf52840 firmware -d firmware/build -p always -- \
#   -DCONF_FILE=prj_sparkfun_tmp102_dk.conf -DDTC_OVERLAY_FILE=app_sparkfun_tmp102_dk.overlay

CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=n
CONFIG_VITABAND_SPARKFUN_TMP102_DK=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_FPU=y

CONFIG_LED=n
CONFIG_BT=n
CONFIG_PWM=n
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_SPI=n
CONFIG_ADC=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_CBPRINTF_FP_SUPPORT=y
