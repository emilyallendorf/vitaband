# Minimal bring-up: MOTOR_EN P0.04 high; BUZZER_EN P0.05 PWM; P0.17 button toggles buzzer.
#
# printk goes to Segger RTT (same J-Link USB as debug/flash), not the COM port.
#   Open “RTT” / RTT Viewer in nRF Connect / VS Code, or J-Link RTT Client.
# If you truly need UART on P0.06/P0.08, set CONFIG_SERIAL=y, CONFIG_UART_CONSOLE=y,
# CONFIG_USE_SEGGER_RTT=n, CONFIG_RTT_CONSOLE=n, and restore uart0 in app_bringup_min.overlay.
#
# Recommended (avoids merging with default prj.conf):
#   west build -b nrf52840dk/nrf52840 firmware -d build-bringup -p always -- \
#     -DCONF_FILE=prj_bringup.conf -DDTC_OVERLAY_FILE=app_bringup_min.overlay
# Then from the same directory: west flash
# (If you built the ambient demo before, use a fresh -d build-bringup or -p always so Kconfig picks this file.)
#
# Append style:
#   -DEXTRA_CONF_FILE=prj_bringup.conf -DDTC_OVERLAY_FILE=app_bringup_min.overlay

# Turn off other demo mains when using bring-up.
CONFIG_VITABAND_AMBIENT_PWM_DEMO=n
CONFIG_VITABAND_TMP102_PWM_DEMO=n
CONFIG_VITABAND_BLINKY_BRINGUP=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_LED=n

CONFIG_BT=n

# printk: RTT console (no UART pins, no COM port selection)
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_I2C=n
CONFIG_SPI=n
CONFIG_ADC=n
CONFIG_PWM=y

# UART driver off — saves code and avoids console fighting disabled uart0 in overlay
CONFIG_SERIAL=n

# If your 32 kHz crystal is not populated or fails, use RC instead of crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
