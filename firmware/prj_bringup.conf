# PCB smoke test: LED blink only (see CONFIG_VITABAND_BLINKY_BRINGUP in Kconfig).
#
# Example (adjust -b to your SoC / board; overlay targets nRF52840-style pins):
#   west build -b nrf52840dk/nrf52840 . -d build-bringup -- \
#     -DEXTRA_CONF_FILE=prj_bringup.conf -DDTC_OVERLAY_FILE=app.overlay
#
# After bring-up, drop EXTRA_CONF_FILE and disable VITABAND_BLINKY_BRINGUP for the full app.

CONFIG_VITABAND_BLINKY_BRINGUP=y

CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Full app stack not needed for blink-only main
CONFIG_BT=n

# test.c pulls in the shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Other translation units still compile; keep drivers the overlay expects
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_PINCTRL=y

CONFIG_NEWLIB_LIBC=y

# mock_sensors.c uses sys_rand32_get(); without this, link fails (undefined z_impl_sys_rand_get)
CONFIG_TEST_RANDOM_GENERATOR=y
