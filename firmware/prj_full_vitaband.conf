# Full VitaBand application → CMake links src/main.c (when CONFIG_VITABAND_BLE_HR_BODY_TEST is off).
#
# **Production / VitaBand PCB flash:** always use the PCB overlay — never the DK overlay:
#   -DDTC_OVERLAY_FILE=app_vitaband_base.overlay
#
# Optional — **nRF52840 DK only** (Arduino wiring, wrong pinout for your PCB): app_main_full_dk.overlay
# exists so bench tests on a DK do not reuse PCB pinmux. Do **not** flash app_main_full_dk.overlay to
# the VitaBand board.
#
# west build -b nrf52840dk/nrf52840 ... -- -DCONF_FILE=prj_full_vitaband.conf -DDTC_OVERLAY_FILE=app_vitaband_base.overlay
#
# (Legacy two-file merge was prj_shell_dev.conf + prj_vitaband_sensors.conf — same Kconfig result when ordered that way.)

CONFIG_BT=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DEVICE_NAME="VitaBand"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_I2C=y
# Custom ambient driver **drivers/src/sht3x-dis.c** — disable Zephyr **sensirion,sht3xd** binding
CONFIG_SHT3XD=n
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PWM=y
CONFIG_SPI=y

CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Single console path: DT zephyr,console = &rtt0 in app_vitaband_base.overlay (do not mix UART_CONSOLE+y + RTT)
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_VITABAND_MAX86140_HR_PPG_100_IRRED=y
