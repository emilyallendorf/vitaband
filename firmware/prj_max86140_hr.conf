# MAX86140/41 SPI heart-rate demo — RTT printk (see app_max86140_hr.overlay).
#
# nRF Connect: conf = this file.
# DK Arduino SPI:  overlay app_max86140_hr.overlay
# VitaBand PCB pins: overlay app_max86140_hr_vitaband.overlay

CONFIG_VITABAND_MAX86140_HR_DEMO=y
CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=n
CONFIG_VITABAND_SPARKFUN_TMP102_DK=n
CONFIG_VITABAND_TMP117_I2C_DEMO=n
CONFIG_VITABAND_PWM_I2C_PIN_SCOPE=n

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y

# Match ambient/tmp117 RTT demos: printk → RTT console only (avoid LOG + RTT printk sharing quirks).
CONFIG_LOG=n

CONFIG_BT=n
CONFIG_SHELL=n
CONFIG_I2C=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_CBPRINTF_FP_SUPPORT=y
