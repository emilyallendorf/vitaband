# MAX86140/41 SPI heart-rate demo — RTT printk.
#
# Overlay MUST match wiring — else Part ID stays 0x00:
#   VitaBand PCB (SPI0):  -DDTC_OVERLAY_FILE=app_max86140_hr_vitaband.overlay
#   DK + Maxim on Arduino: -DDTC_OVERLAY_FILE=app_max86140_hr.overlay

CONFIG_VITABAND_MAX86140_HR_DEMO=y
CONFIG_VITABAND_MAX86140_HR_PP_TRACE=y
# Optional: higher IR sample rate (IR-only, no red/SpO2). Datasheet N=2 only to ~100 sps;
# ~200/~400 sps use PPG_SR 0x04/0x05 + N=1. “500 Hz” as IR+Red N=2 is not in the table;
# for ~512 sps N=1 we could add another Kconfig row (PPG_SR 0x10) later.
# CONFIG_VITABAND_MAX86140_HR_PPG_200_IR=y
# CONFIG_VITABAND_MAX86140_HR_PPG_400_IR=y
# Verbose SPI + HR NDJSON on RTT — enable only when debugging transport:
# CONFIG_VITABAND_MAX86140_AGENT_LOG=y
# CS GPIO probe at boot (~22 s). Set to n for faster boot / less grey noise in IDE.
# CONFIG_VITABAND_MAX86140_CS_GPIO_DEBUG=y
CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=n
CONFIG_VITABAND_SPARKFUN_TMP102_DK=n
CONFIG_VITABAND_TMP117_I2C_DEMO=n
CONFIG_VITABAND_PWM_I2C_PIN_SCOPE=n

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y

# Match ambient/tmp117 RTT demos: printk → RTT console only (avoid LOG + RTT printk sharing quirks).
CONFIG_LOG=n

CONFIG_BT=n
CONFIG_SHELL=n
CONFIG_I2C=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_CBPRINTF_FP_SUPPORT=y
