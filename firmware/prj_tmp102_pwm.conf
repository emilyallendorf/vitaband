# TMP102 on DK I2C → PWM duty on P0.05 (scope). Conflicts with other VitaBand mains.
#
# west build -b nrf52840dk/nrf52840 firmware -d build-tmp102-pwm -p always -- \
#   -DCONF_FILE=prj_tmp102_pwm.conf -DDTC_OVERLAY_FILE=app_tmp102_pwm.overlay

CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=n
CONFIG_VITABAND_TMP102_PWM_DEMO=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_FPU=y

CONFIG_LED=n
CONFIG_BT=n

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n

CONFIG_SHELL=n
CONFIG_SPI=n
CONFIG_ADC=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
