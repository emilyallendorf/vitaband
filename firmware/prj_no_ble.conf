# Full sensor loop + state machine + shell, no Bluetooth stack.
# Matches production main() logic except BT init / advertising / GATT.
#
#   west build -b <your_board> . -- \
#     -DEXTRA_CONF_FILE=prj_no_ble.conf -DDTC_OVERLAY_FILE=app.overlay
#
CONFIG_VITABAND_NO_BLE=y
CONFIG_BT=n

CONFIG_LOG=y
CONFIG_I2C=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PWM=n
CONFIG_SPI=y
CONFIG_GPIO=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_TEST_RANDOM_GENERATOR=y
