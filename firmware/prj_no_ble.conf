# Full sensor loop + state machine + shell, no Bluetooth stack.
# Matches production main() logic except BT init / advertising / GATT.
#
#   west build -b <your_board> firmware -- \
#     -DEXTRA_CONF_FILE=prj_no_ble.conf
# (Add -DDTC_OVERLAY_FILE=... only if you have a board-specific overlay fragment.)
#
CONFIG_VITABAND_NO_BLE=y
CONFIG_BT=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_I2C=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PWM=y
CONFIG_SPI=y
CONFIG_GPIO=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_TEST_RANDOM_GENERATOR=y
