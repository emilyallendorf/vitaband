# Development shell + BLE base (uses src/main.c unless another VITABAND_* demo is enabled).
# Typical merge for sensors: -DCONF_FILE="prj_shell_dev.conf;prj_vitaband_sensors.conf"
CONFIG_BT=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DEVICE_NAME="VitaBand"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_I2C=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PWM=y
CONFIG_SPI=y

# Shell for interactive testing
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Math library for mock sensors
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Random number generator for noise
CONFIG_TEST_RANDOM_GENERATOR=y
