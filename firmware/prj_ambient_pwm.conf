# Ambient SHT3x → printk on Segger RTT (same J-Link USB as debug/flash; not the COM port).
# Open RTT Viewer in nRF Connect / VS Code, or J-Link RTT Client.
#
# MERGE ORDER: If you combine fragments, list this file LAST, or use only:
#   -DCONF_FILE=prj_ambient_pwm.conf
#
# Recommended:
#   west build -b nrf52840dk/nrf52840 firmware -d build-ambient -p always -- \
#     -DCONF_FILE=prj_ambient_pwm.conf -DDTC_OVERLAY_FILE=app_ambient_pwm.overlay

CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_TMP102_PWM_DEMO=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_FPU=y

CONFIG_LED=n
CONFIG_BT=n

CONFIG_PWM=n

CONFIG_LOG=n

CONFIG_SHELL=n
CONFIG_SPI=n
CONFIG_ADC=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# printk: RTT console (no UART; uart0 disabled in app_ambient_pwm.overlay)
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Last lines: keep RTT if extra conf fragments are merged ---
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
