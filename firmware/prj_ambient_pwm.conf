# Ambient SHT3x → printk on Segger RTT (same J-Link USB as debug/flash; not the COM port).
# Open RTT Viewer in nRF Connect / VS Code, or J-Link RTT Client.
#
# MERGE ORDER: If you combine fragments, list this file LAST, or use only:
#   -DCONF_FILE=prj_ambient_pwm.conf
#
# Recommended (use -d firmware/build so .vscode can find compile_commands.json for F12):
#   west build -b nrf52840dk/nrf52840 firmware -d firmware/build -p always -- \
#     -DCONF_FILE=prj_ambient_pwm.conf -DDTC_OVERLAY_FILE=app_ambient_pwm.overlay
# If I2C still NACKs, try DK-style SDA/SCL swap (list dkswap second):
#   -DDTC_OVERLAY_FILE="app_ambient_pwm.overlay;app_ambient_pwm_i2c_dkswap.overlay"

CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_SPARKFUN_TMP102_DK=n
CONFIG_VITABAND_TMP117_I2C_DEMO=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_FPU=y

# TWIM backend: do **not** set CONFIG_I2C_NRFX_TWIM here — NCS/Zephyr treats it as a non-prompt
# hidden symbol; it follows devicetree (`compatible = "nordic,nrf-twim"` on &i2c0 in overlay) + `CONFIG_I2C=y`.

CONFIG_LED=n
CONFIG_BT=n
CONFIG_PWM=n
CONFIG_LOG=n

CONFIG_SHELL=n
CONFIG_SPI=n
CONFIG_ADC=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# VitaBand custom SHT3x driver (drivers/src/sht3x-dis.c) via I2C — leave Zephyr SHT3XD off
# so it does not register on the same devicetree node as `sht3xdis`.
#
# Keep SENSOR off for this custom-driver build. To prevent Kconfig from forcing SENSOR=y,
# disable LF RC calibration path that selects TEMP_NRF5 -> SENSOR.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n

CONFIG_SHT3XD=n
CONFIG_SENSOR=n


CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n


CONFIG_CBPRINTF_FP_SUPPORT=y
