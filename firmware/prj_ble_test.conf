# Isolated BLE peripheral test. Recommended overlay (disables UART/I2C/SPI/etc.):
#   -DDTC_OVERLAY_FILE=app_ble_test_min.overlay
#
CONFIG_VITABAND_BLE_TEST=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="VitaBand BLE Test"
CONFIG_BT_DEVICE_APPEARANCE=833

# Keep this build isolated from sensor/haptics stacks.
CONFIG_I2C=n
CONFIG_SPI=n
CONFIG_PWM=n
CONFIG_SHELL=n

# RTT console for quick bring-up logs.
CONFIG_LOG=n
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_CBPRINTF_FP_SUPPORT=y
