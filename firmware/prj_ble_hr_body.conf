# BLE + MAX86140 HR + TMP117 body temp (live notify). Pick ONE overlay for your board:
#
# Build directory (-d / -B): never use '&' in the path — the shell treats it as
# "run in background" and breaks CMake/Ninja (e.g. use build_hr_body_ble, not build_tmp&hr&ble).
#
#   DK + Maxim on Arduino SPI + TMP117 on Arduino I2C:
#     -DDTC_OVERLAY_FILE=app_ble_hr_body_dk.overlay
#     (TMP117 NACK on DK: append ;app_tmp117_i2c_dkswap.overlay)
#
#   VitaBand PCB (SPI0 MAX86140 + TWIM1 TMP117 on P0.26/P0.27):
#     -DDTC_OVERLAY_FILE=app_ble_hr_body_vitaband.overlay
#
# PPG mode: driver needs 100 sps IR+Red for correct FIFO stride when HR_DEMO is off.
CONFIG_VITABAND_BLE_HR_BODY_TEST=y
CONFIG_VITABAND_MAX86140_HR_PPG_100_IRRED=y

# Console: only printk() from main_ble_hr_body.c — drivers/state_manager silence LOG_* via preprocessor when above is set.
CONFIG_BOOT_BANNER=n
# Optional wrist tuning: CONFIG_VITABAND_MAX86140_HR_WRIST_PROFILE=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="VitaBand BLE HR+Body"
CONFIG_BT_DEVICE_APPEARANCE=833

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_PWM=y

CONFIG_SHELL=n
CONFIG_LOG=n

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=n
CONFIG_VITABAND_SPARKFUN_TMP102_DK=n
CONFIG_VITABAND_TMP117_I2C_DEMO=n
CONFIG_VITABAND_MAX86140_HR_DEMO=n
CONFIG_VITABAND_PWM_I2C_PIN_SCOPE=n
CONFIG_VITABAND_BLE_TEST=n
CONFIG_VITABAND_BLE_BODY_TEMP_TEST=n
