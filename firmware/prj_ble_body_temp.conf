# BLE peripheral + TMP117 body temperature → custom health telemetry notify.
# HR and ambient °C are fixed in main_ble_body_temp.c.
#
# Build directory: do not use '&' in -B / -d paths — the shell treats & as a control
# operator and breaks Zephyr's generated path logic (syscalls_subdirs, etc.).
#
# VitaBand I2C wiring (default pinctrl in app_ble_body_temp.overlay):
#   west build ... -DCONF_FILE=prj_ble_body_temp.conf \
#     -DDTC_OVERLAY_FILE=app_ble_body_temp.overlay
#
# nRF52840 DK Arduino I2C (swap SDA/SCL vs overlay):
#   -DDTC_OVERLAY_FILE="app_ble_body_temp.overlay;app_tmp117_i2c_dkswap.overlay"

CONFIG_VITABAND_BLE_BODY_TEMP_TEST=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="VitaBand BLE Body"
CONFIG_BT_DEVICE_APPEARANCE=833

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y

CONFIG_SPI=n
CONFIG_PWM=n
CONFIG_SHELL=n
CONFIG_LOG=n

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
