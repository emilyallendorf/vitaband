# Full VitaBand app + MAX86140 PPG options.
#
# Merge *after* prj.conf so entries here override (e.g. shell off, RTT console):
#   -DCONF_FILE="prj.conf;prj_vitaband_sensors.conf"
#
# Console: app_vitaband_base.overlay sets zephyr,console = &rtt0 (Segger RTT UART).
# Use **Segger RTT Viewer** / nRF Connect RTT on the **J-Link USB** interface — not the
# DK virtual COM port (uart0 is disabled in that overlay).

CONFIG_BT=y
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DEVICE_NAME="VitaBand"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_I2C=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PWM=y
CONFIG_SPI=y

CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
# CONFIG_BOOT_BANNER=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Virtual UART on RTT (matches DT chosen zephyr,console = &rtt0 in app_vitaband_base.overlay)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_VITABAND_MAX86140_HR_PPG_100_IRRED=y
# CONFIG_VITABAND_MAX86140_HR_WRIST_PROFILE=y
# CONFIG_VITABAND_MAX86140_HR_WRIST_BPM_OFFSET=-6
