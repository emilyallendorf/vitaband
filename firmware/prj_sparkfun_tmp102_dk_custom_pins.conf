# SparkFun TMP102 on **custom** TWIM pins — edit `app_sparkfun_tmp102_dk_custom_pins.overlay`
# (default P0.28 SDA / P0.29 SCL ≈ Arduino A2/A3 on many DKs).
#
# west build -b nrf52840dk/nrf52840 firmware -d firmware/build -p always -- \
#   -DCONF_FILE=prj_sparkfun_tmp102_dk_custom_pins.conf \
#   -DDTC_OVERLAY_FILE=app_sparkfun_tmp102_dk_custom_pins.overlay

CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=n
CONFIG_VITABAND_SPARKFUN_TMP102_DK=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_FPU=y

CONFIG_LED=n
CONFIG_BT=n
CONFIG_PWM=n
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_SPI=n
CONFIG_ADC=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_CBPRINTF_FP_SUPPORT=y
