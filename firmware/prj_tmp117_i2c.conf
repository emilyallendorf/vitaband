# TMP117 I2C bring-up: TI TMP117 @ reg from overlay (default 0x49 = ADD0→V+).
#
# west build -b nrf52840dk/nrf52840 firmware -d firmware/build -p always -- \
#   -DCONF_FILE=prj_tmp117_i2c.conf -DDTC_OVERLAY_FILE=app_tmp117_i2c.overlay
#
# DK pin order (D14=SDA, D15=SCL):
#   -DDTC_OVERLAY_FILE="app_tmp117_i2c.overlay;app_tmp117_i2c_dkswap.overlay"

CONFIG_VITABAND_BLINKY_BRINGUP=n
CONFIG_VITABAND_AMBIENT_PWM_DEMO=n
CONFIG_VITABAND_SPARKFUN_TMP102_DK=n
CONFIG_VITABAND_TMP117_I2C_DEMO=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_FPU=y

CONFIG_LED=n
CONFIG_BT=n
CONFIG_PWM=n
CONFIG_LOG=n

# Temperature: Vitaband `drivers/src/tmp117.c` only (CMake). Do not add CONFIG_TMP117 here — symbol
# name/absence varies by NCS version and triggers Kconfig errors if mistyped.

CONFIG_SHELL=n
CONFIG_SPI=n
CONFIG_ADC=n

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_CBPRINTF_FP_SUPPORT=y
